---
- name: Copy app files to VM
  become: true
  ansible.builtin.copy:
    src: "{{ role_path }}/files/"
    dest: /tmp/node_monitoring/
    mode: "0755"

- name: Build docker image
  become: true
  community.docker.docker_image:
    name: node-monitoring
    build:
      path: /tmp/node_monitoring
    source: build

      
